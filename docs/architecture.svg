<!-- Architecture overview. Edit by hand; the README embeds this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="862" viewBox="0 0 680 862" role="img">
<title>NetBox GitOps controller architecture</title>
<desc>The netbox-gitops tool contains all commands. Collect and ingest read the Proxmox API and write YAML into the Git repository, where engineers also write YAML. The sync pipeline loads the repository, validates it, works out what changed and reconciles it into NetBox. Scan reads iDRAC BMCs and a facts writer puts hardware fields straight into NetBox. Export reads NetBox and writes YAML files that return to the Git repository once committed.</desc>

