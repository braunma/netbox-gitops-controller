<!-- Workflow strip for the README. Edit by hand; generated once, no build step. -->
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" role="img">
<title>How a change reaches NetBox</title>
<desc>Four steps from left to right: edit the YAML, check it offline with yamlcheck, open a merge request where the pipeline posts a dry-run plan, and after the merge apply the same sync for real. NetBox changes only in the last step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.tl{font-size:11px;fill:#5F5E5A}
.num{font-size:12px;font-weight:600;fill:#FFFFFF}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
<rect x="0.5" y="0.5" width="679" height="149" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<g class="c-gray">
<rect x="21.0" y="46" width="136" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="89.0" y="73.0" text-anchor="middle" dominant-baseline="central">Edit the YAML</text>
<text class="ts" x="89.0" y="92.0" text-anchor="middle" dominant-baseline="central">in a branch</text>
</g>
<circle cx="21.0" cy="46" r="11" fill="#5F5E5A"/><text class="num" x="21.0" y="46" text-anchor="middle" dominant-baseline="central">1</text>
<line class="arr" x1="161.0" y1="81.0" x2="182.33333333333334" y2="81.0" marker-end="url(#arrow)"/>
<g class="c-teal">
<rect x="188.33333333333334" y="46" width="136" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="256.33333333333337" y="73.0" text-anchor="middle" dominant-baseline="central">Check</text>
<text class="ts" x="256.33333333333337" y="92.0" text-anchor="middle" dominant-baseline="central">yamlcheck, offline</text>
</g>
<circle cx="188.33333333333334" cy="46" r="11" fill="#0F6E56"/><text class="num" x="188.33333333333334" y="46" text-anchor="middle" dominant-baseline="central">2</text>
<line class="arr" x1="328.33333333333337" y1="81.0" x2="349.6666666666667" y2="81.0" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="355.6666666666667" y="46" width="136" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="423.6666666666667" y="65.0" text-anchor="middle" dominant-baseline="central">Merge request</text>
<text class="ts" x="423.6666666666667" y="84.0" text-anchor="middle" dominant-baseline="central">the pipeline posts</text>
<text class="ts" x="423.6666666666667" y="100.0" text-anchor="middle" dominant-baseline="central">the dry-run plan</text>
</g>
<circle cx="355.6666666666667" cy="46" r="11" fill="#534AB7"/><text class="num" x="355.6666666666667" y="46" text-anchor="middle" dominant-baseline="central">3</text>
<line class="arr" x1="495.6666666666667" y1="81.0" x2="517.0" y2="81.0" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="523.0" y="46" width="136" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="591.0" y="65.0" text-anchor="middle" dominant-baseline="central">Apply</text>
<text class="ts" x="591.0" y="84.0" text-anchor="middle" dominant-baseline="central">after the merge:</text>
<text class="ts" x="591.0" y="100.0" text-anchor="middle" dominant-baseline="central">the real sync</text>
</g>
<circle cx="523.0" cy="46" r="11" fill="#534AB7"/><text class="num" x="523.0" y="46" text-anchor="middle" dominant-baseline="central">4</text>
<text class="tl" x="340.0" y="136" text-anchor="middle" dominant-baseline="central">NetBox changes only in step 4. Steps 1 to 3 never write to it.</text>
</svg>
