<!-- Phase order for docs/CONCEPTS.md. Edit by hand; generated once, no build step. -->
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 0 680 478" role="img">
<title>The order in which a sync reconciles objects</title>
<desc>Phase 1 foundation: tags, roles, custom fields, platforms, tenant groups, tenants, sites, racks. Phase 2, two groups: network (VRFs, VLAN groups, VLANs, prefixes) and device-types (module types, then device types). Phase 3 devices: each device with its interfaces, ports, bays and modules, then all cables. Phase 4 virtualization: cluster types, cluster groups, clusters, VMs with interfaces and IPs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.tl{font-size:11px;fill:#5F5E5A}
.num{font-size:12px;font-weight:600;fill:#FFFFFF}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
<rect x="0.5" y="0.5" width="679" height="477" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<g class="c-gray">
<rect x="40" y="40" width="600" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="61.0" text-anchor="middle" dominant-baseline="central">foundation</text>
<text class="ts" x="340.0" y="80.0" text-anchor="middle" dominant-baseline="central">tags → roles → custom fields → platforms →</text>
<text class="ts" x="340.0" y="96.0" text-anchor="middle" dominant-baseline="central">tenant groups → tenants → sites → racks</text>
</g>
<circle cx="40" cy="40" r="11" fill="#5F5E5A"/><text class="num" x="40" y="40" text-anchor="middle" dominant-baseline="central">1</text>
<line class="arr" x1="340.0" y1="118" x2="340.0" y2="142" marker-end="url(#arrow)"/>
<g class="c-teal">
<rect x="40" y="148" width="290.0" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="185.0" y="169.0" text-anchor="middle" dominant-baseline="central">network</text>
<text class="ts" x="185.0" y="188.0" text-anchor="middle" dominant-baseline="central">VRFs → VLAN groups →</text>
<text class="ts" x="185.0" y="204.0" text-anchor="middle" dominant-baseline="central">VLANs → prefixes</text>
</g>
<circle cx="40" cy="148" r="11" fill="#0F6E56"/><text class="num" x="40" y="148" text-anchor="middle" dominant-baseline="central">2</text>
<g class="c-teal">
<rect x="350.0" y="148" width="290.0" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="495.0" y="169.0" text-anchor="middle" dominant-baseline="central">device-types</text>
<text class="ts" x="495.0" y="188.0" text-anchor="middle" dominant-baseline="central">module types → device types</text>
<text class="ts" x="495.0" y="204.0" text-anchor="middle" dominant-baseline="central">(with their component templates)</text>
</g>
<circle cx="350.0" cy="148" r="11" fill="#0F6E56"/><text class="num" x="350.0" y="148" text-anchor="middle" dominant-baseline="central">2</text>
<line class="arr" x1="340.0" y1="226" x2="340.0" y2="250" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="40" y="256" width="600" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="277.0" text-anchor="middle" dominant-baseline="central">devices</text>
<text class="ts" x="340.0" y="296.0" text-anchor="middle" dominant-baseline="central">per device: device → interfaces (IP, primary IP, LAG members) →</text>
<text class="ts" x="340.0" y="312.0" text-anchor="middle" dominant-baseline="central">rear ports → front ports → device bays → modules; then all cables</text>
</g>
<circle cx="40" cy="256" r="11" fill="#534AB7"/><text class="num" x="40" y="256" text-anchor="middle" dominant-baseline="central">3</text>
<line class="arr" x1="340.0" y1="334" x2="340.0" y2="358" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="40" y="364" width="600" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="385.0" text-anchor="middle" dominant-baseline="central">virtualization</text>
<text class="ts" x="340.0" y="404.0" text-anchor="middle" dominant-baseline="central">cluster types → cluster groups → clusters →</text>
<text class="ts" x="340.0" y="420.0" text-anchor="middle" dominant-baseline="central">VMs → VM interfaces → VM IPs</text>
</g>
<circle cx="40" cy="364" r="11" fill="#993C1D"/><text class="num" x="40" y="364" text-anchor="middle" dominant-baseline="central">4</text>
</svg>
