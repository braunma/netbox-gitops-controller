<!-- Cable path for docs/WRITING_YAML.md. Edit by hand; generated once, no build step. -->
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img">
<title>A cable path through two patch panels</title>
<desc>The server interface eth1 is connected by a patch cord to front port 2 of patch panel pp-a01. Its rear port 2 is connected by a backbone cable to rear port 2 of patch panel pp-b02, whose front port 2 is connected by a patch cord to port Eth1/2 of switch leaf-02. One link declaration with via produces these three cables.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.tl{font-size:11px;fill:#5F5E5A}
.num{font-size:12px;font-weight:600;fill:#FFFFFF}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
<rect x="0.5" y="0.5" width="679" height="229" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text class="ts" x="340.0" y="30" text-anchor="middle" dominant-baseline="central">You declare one link, from the server to the switch. The controller creates the three cables.</text>
<g class="c-gray">
<rect x="20" y="64" width="112" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="76.0" y="88.0" text-anchor="middle" dominant-baseline="central">Server</text>
<text class="ts" x="76.0" y="107.0" text-anchor="middle" dominant-baseline="central">srv, eth1</text>
</g>
<g class="c-teal">
<rect x="180" y="64" width="140" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="250.0" y="88.0" text-anchor="middle" dominant-baseline="central">Patch panel</text>
<text class="ts" x="250.0" y="107.0" text-anchor="middle" dominant-baseline="central">pp-a01, port 2</text>
</g>
<g class="c-teal">
<rect x="360" y="64" width="140" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="430.0" y="88.0" text-anchor="middle" dominant-baseline="central">Patch panel</text>
<text class="ts" x="430.0" y="107.0" text-anchor="middle" dominant-baseline="central">pp-b02, port 2</text>
</g>
<g class="c-gray">
<rect x="548" y="64" width="112" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="604.0" y="88.0" text-anchor="middle" dominant-baseline="central">Switch</text>
<text class="ts" x="604.0" y="107.0" text-anchor="middle" dominant-baseline="central">leaf-02, Eth1/2</text>
</g>
<line x1="135" y1="96.0" x2="177" y2="96.0" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
<line x1="323" y1="96.0" x2="357" y2="96.0" stroke="#993C1D" stroke-width="4" stroke-linecap="round"/>
<line x1="503" y1="96.0" x2="545" y2="96.0" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
<text class="tl" x="156.0" y="154" text-anchor="middle" dominant-baseline="central">patch cord</text>
<text class="tl" x="156.0" y="169" text-anchor="middle" dominant-baseline="central">cable 1</text>
<text class="tl" x="340.0" y="154" text-anchor="middle" dominant-baseline="central">backbone</text>
<text class="tl" x="340.0" y="169" text-anchor="middle" dominant-baseline="central">cable 2</text>
<text class="tl" x="524.0" y="154" text-anchor="middle" dominant-baseline="central">patch cord</text>
<text class="tl" x="524.0" y="169" text-anchor="middle" dominant-baseline="central">cable 3</text>
<text class="tl" x="340.0" y="206" text-anchor="middle" dominant-baseline="central">Inside each panel, the front port is already connected to the rear port.</text>
</svg>
