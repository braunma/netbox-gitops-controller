# =============================================================================
# NetBox GitOps Controller - CI/CD Pipeline
# =============================================================================
#
# Set variables in GitLab Project → Settings → CI/CD → Variables (project-wide)
# or under CI/CD → Run Pipeline (one run). Every variable this pipeline reads is
# listed below; the defaults live in the `variables:` block further down.
#
# REQUIRED — the pipeline reaches no NetBox without these:
#
#   NETBOX_URL                 Base URL of your NetBox, no trailing /api.
#                              Used by go_validate, go_plan and go_apply.
#   NETBOX_TOKEN               API token, v1 (40 hex chars) or v2
#                              (nbt_<key>.<secret>). Mark it masked.
#                              The e2e job does NOT use these: it overrides
#                              both in its own shell and talks only to the
#                              throwaway NetBox it starts as a service.
#
# INFRASTRUCTURE — override when running on-prem or behind a private registry:
#
#   GITLAB_RUNNER_TAG          Runner tag every job requests.
#                              Default: "docker"
#   GOLANG_IMAGE               Go toolchain image for the go_* jobs.
#                              Default: "golang:1.24"
#   NETBOX_IMAGE               NetBox image for the e2e job's service.
#                              Default: "netboxcommunity/netbox:v4.6-3.3.0"
#   POSTGRES_IMAGE             Default: "postgres:16-alpine"
#   REDIS_IMAGE                Default: "valkey/valkey:8-alpine"
#                              (mirror the last three into your own registry)
#
# WHICH JOBS RUN — note the exact spellings; the comparisons are literal, so
# "False" does not skip anything and "True" does not enable anything:
#
#   RUN_QUALITY_CHECKS         "false" skips go_lint and yaml_check.
#                              Any other value runs them. Default: "true"
#   RUN_TESTS                  "false" skips go_test. Any other value runs it.
#                              Default: "true"
#   RUN_E2E                    "true" — and only "true" — enables the e2e job.
#                              Default: "false". Needs a Docker-executor runner
#                              that can pull the three images above.
#
# THRESHOLDS AND GATES:
#
#   COVERAGE_THRESHOLD         Minimum total statement coverage (%). The
#                              default lives in the Makefile (make coverage),
#                              which this pipeline and GitHub Actions both
#                              call, so the bar is defined once. Set this to
#                              override it. A non-numeric or empty value fails
#                              the job rather than disabling the gate.
#
# THE END-TO-END SCRIPTS also read E2E_SEEDS, E2E_KEEP and E2E_WORK; the e2e
# job sets E2E_SEEDS and leaves the rest at their defaults. See
# tests/e2e/README.md.
#
# PRECEDENCE, worth knowing before you set anything: a variable set in the UI
# at project, group or instance level outranks everything written in this file,
# job-level `variables:` included.
# That is why the e2e job exports its NetBox target in the job shell instead —
# a project NETBOX_URL would otherwise point tests that delete every
# gitops-tagged object at the real instance.
#
# =============================================================================

stages:
  - test      # Run tests
  - build     # Build Go binary
  - validate  # Validate YAML and configuration
  - plan      # Dry-run preview (Merge Requests)
  - apply     # Apply changes (Main branch)

variables:
  # ===========================================================================
  # ENVIRONMENT-SPECIFIC VARIABLES
  # Override these in GitLab CI/CD Settings > Variables for your environment
  # ===========================================================================

  # GitLab Runner tag (override in GitLab Variables if needed)
  GITLAB_RUNNER_TAG: "docker"

  # Container image registry paths (override in GitLab Variables for private registries)
  GOLANG_IMAGE: "golang:1.24"

  # END-TO-END TEST IMAGES
  # The e2e job starts a throwaway NetBox from these images as CI services.
  # Mirror them into your own registry and override here when running on-prem.
  NETBOX_IMAGE: "netboxcommunity/netbox:v4.6-3.3.0"
  POSTGRES_IMAGE: "postgres:16-alpine"
  REDIS_IMAGE: "valkey/valkey:8-alpine"

  # END-TO-END TESTS (opt-in)
  # The e2e job drives the built binary against a real NetBox and asserts the
  # properties an in-memory fake cannot show: that a dry run writes nothing,
  # that a second apply has nothing left to do, and that pruning a converged
  # instance deletes nothing. It needs a Docker-executor runner that can pull
  # NETBOX_IMAGE/POSTGRES_IMAGE/REDIS_IMAGE, so it is off by default.
  RUN_E2E: "false"

  # ===========================================================================
  # PIPELINE CONTROL VARIABLES
  # Set these per-pipeline to skip optional jobs and speed up execution
  # ===========================================================================

  # RUN_QUALITY_CHECKS: Controls linting and YAML validation jobs
  # Set to "false" to skip quality checks (faster pipeline)
  # Default: "true" - runs all quality checks
  RUN_QUALITY_CHECKS: "true"

  # RUN_TESTS: Controls test execution (go_test)
  # Set to "false" to skip tests (faster pipeline)
  # Default: "true" - runs all tests
  RUN_TESTS: "true"

  # ===========================================================================
  # BUILD CONFIGURATION
  # ===========================================================================

  # Go variables
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  CGO_ENABLED: "1"

default:
  tags:
    - ${GITLAB_RUNNER_TAG}

cache:
  paths:
    - .cache/go-build
    - .go/pkg/mod

# =============================================================================
# GO JOBS
# =============================================================================

.go_base:
  image: ${GOLANG_IMAGE}
  before_script:
    - go version
    - go mod download

# Run Go tests
go_test:
  extends: .go_base
  stage: test
  script:
    # `make coverage` runs the tests and enforces the gate. Both this pipeline
    # and .github/workflows/ci.yml call it, so the scope measured and the bar
    # applied are defined once, in the Makefile, and cannot drift apart.
    - echo "🧪 Running Go tests..."
    - make coverage
    - echo "✅ All Go tests passed!"
  coverage: '/^total:.*\s(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
  rules:
    - if: $RUN_TESTS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# End-to-end test against a real NetBox.
#
# NetBox, PostgreSQL and Redis run as CI services. FF_NETWORK_PER_BUILD is
# required: without it the service containers get no shared network and NetBox
# cannot reach its database.
#
# The credentials below are throwaway values for a container that lives for the
# length of one job. Do not reuse them anywhere else. NetBox 4.5+ issues "v2"
# tokens (nbt_<key>.<secret>) and its container bootstrap only ever creates
# that kind, which is why NETBOX_TOKEN is assembled from the key and secret.
e2e:
  extends: .go_base
  stage: test
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
    - name: ${REDIS_IMAGE}
      alias: redis
    - name: ${NETBOX_IMAGE}
      alias: netbox
  variables:
    FF_NETWORK_PER_BUILD: "true"
    # PostgreSQL service
    POSTGRES_DB: netbox
    POSTGRES_USER: netbox
    POSTGRES_PASSWORD: netbox
    # NetBox -> PostgreSQL / Redis
    DB_HOST: postgres
    DB_NAME: netbox
    DB_USER: netbox
    DB_PASSWORD: netbox
    REDIS_HOST: redis
    REDIS_DATABASE: "0"
    REDIS_CACHE_HOST: redis
    REDIS_CACHE_DATABASE: "1"
    SECRET_KEY: "ci-only-secret-key-at-least-fifty-characters-long-0123456789"
    API_TOKEN_PEPPER_1: "ci-only-token-pepper-at-least-fifty-characters-long-0123456789"
    SUPERUSER_NAME: admin
    SUPERUSER_EMAIL: admin@example.com
    SUPERUSER_PASSWORD: admin
    SUPERUSER_API_KEY: "citokenkey01"
    SUPERUSER_API_TOKEN: "0123456789abcdef0123456789abcdef01234567"
    E2E_SEEDS: "1 2 3"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-yaml curl
    # Where the controller points is set HERE, in the job shell, and not in the
    # variables: block above.
    #
    # GitLab ranks a UI-set CI/CD variable (project, group or instance) above
    # anything .gitlab-ci.yml says, job-level included. The apply jobs need
    # NETBOX_URL and NETBOX_TOKEN set that way to reach the real NetBox — so a
    # job-level default
    # would be silently overridden by them, and these scripts wipe every
    # gitops-tagged object between seeds. That would point a --prune at
    # production. A shell export outranks every variable source, so this cannot
    # be inherited away.
    - export NETBOX_URL="http://netbox:8080"
    - export NETBOX_TOKEN="nbt_${SUPERUSER_API_KEY}.${SUPERUSER_API_TOKEN}"
    # Fail closed if that ever stops being true (an edit above, a future
    # GitLab change): these scripts must only ever see the throwaway service.
    - |
      if [ "${NETBOX_URL}" != "http://netbox:8080" ]; then
        echo "❌ e2e targets ${NETBOX_URL}, which is not the disposable CI service."
        echo "   These tests delete every gitops-tagged object. Refusing to run."
        exit 1
      fi
  script:
    - echo "🔁 Running end-to-end tests against ${NETBOX_URL}..."
    - tests/e2e/run.sh
    - echo "🔁 Verifying that renames edit objects instead of duplicating them..."
    - tests/e2e/rename.sh
    - echo "🔁 Applying this repository's own data and checking its conventions..."
    - tests/e2e/repo-data.sh
  rules:
    - if: $RUN_E2E != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# Build Go binary
go_build:
  extends: .go_base
  stage: build
  script:
    - echo "🔨 Building Go binary..."
    # Stamp the build so `netbox-gitops --version` identifies exactly what ran,
    # which is what makes the changelog's upgrade advice actionable.
    - |
      VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}}"
      go build -v -trimpath \
        -ldflags "-X main.version=${VERSION} -X main.commit=${CI_COMMIT_SHORT_SHA} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -o netbox-gitops ./cmd/netbox-gitops/
    - ./netbox-gitops --version
    - ./netbox-gitops --help
    - echo "✅ Go binary built successfully!"
  artifacts:
    paths:
      - netbox-gitops
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# Validate with Go (dry-run)
go_validate:
  extends: .go_base
  stage: validate
  dependencies:
    - go_build
  script:
    # Ask the target instance what it accepts before planning against it: a
    # choice value or a reference this NetBox rejects would otherwise surface
    # as a 400 partway through the apply job, with earlier objects written.
    - echo "🔍 Validating against the live NetBox..."
    - ./netbox-gitops validate
    - echo "🔍 Planning with Go implementation..."
    - ./netbox-gitops --dry-run
    - echo "✅ Validation passed!"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Plan changes with Go (MR preview)
go_plan:
  extends: .go_base
  stage: plan
  dependencies:
    - go_build
  script:
    - echo "📜 Generating sync plan with Go..."
    - ./netbox-gitops --dry-run | tee plan-output.txt
    - echo "✅ Plan generated successfully!"
  artifacts:
    paths:
      - plan-output.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Apply changes with Go (production)
go_apply:
  extends: .go_base
  stage: apply
  dependencies:
    - go_build
  script:
    - echo "🚀 Applying changes to NetBox with Go..."
    - ./netbox-gitops
    - echo "✅ Changes applied successfully!"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production

# =============================================================================
# UTILITY JOBS
# =============================================================================

# `make lint` and not `go fmt ./...`: go fmt REWRITES the files it visits and
# exits 0 either way, so it reported success on unformatted code — and with
# allow_failure it could not have failed the job regardless. make lint checks
# with `gofmt -l`, runs go vet, and verifies the SPDX headers.
go_lint:
  extends: .go_base
  stage: test
  script:
    - echo "🔍 Running Go linters..."
    - make lint
    - echo "✅ Linting passed!"
  rules:
    - if: $RUN_QUALITY_CHECKS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

yaml_check:
  extends: .go_base
  stage: test
  script:
    - echo "📝 Checking YAML syntax..."
    # Check YAML files in example directory (used by CI) and any custom definitions
    - go run ./cmd/yamlcheck
  rules:
    - if: $RUN_QUALITY_CHECKS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# In the validate stage, not build: `dependencies` may only name jobs from an
# earlier stage, and go_build is in build. As a build-stage job this failed
# pipeline validation and could never have downloaded the binary it prints.
debug_environment:
  extends: .go_base
  stage: validate
  script:
    - echo "📂 Repository structure:"
    - ls -la
    - echo "📂 Example directory structure:"
    - ls -la example/ || echo "No example directory"
    - echo "📦 Go modules:"
    - go list -m all
    - echo "🔧 Go environment:"
    - go env
    - echo "📄 Binary info:"
    - ./netbox-gitops --help || echo "Binary not built yet"
    - echo "🧪 Testing data directory access:"
    - ls -la definitions/ inventory/ || echo "Data directories not found"
  dependencies:
    - go_build
  when: manual
  allow_failure: true
