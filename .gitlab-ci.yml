# =============================================================================
# NetBox GitOps Controller - CI/CD Pipeline
# =============================================================================
#
# CONFIGURATION INSTRUCTIONS:
# ---------------------------
# This pipeline uses variables for all environment-specific settings.
# To configure for your environment, set these variables in:
#   GitLab Project → Settings → CI/CD → Variables
#
# Required variables to override (if using private infrastructure):
#
#   GITLAB_RUNNER_TAG          GitLab runner tag
#                              Default: "docker"
#
# Optional variables to override:
#
#   GOLANG_IMAGE               Go compiler image
#                              Default: "golang:1.24"
#
#   NETBOX_IMAGE               NetBox image for the end-to-end job
#                              Default: "netboxcommunity/netbox:v4.6-3.3.0"
#   POSTGRES_IMAGE             PostgreSQL image for the end-to-end job
#                              Default: "postgres:16-alpine"
#   REDIS_IMAGE                Redis/Valkey image for the end-to-end job
#                              Default: "valkey/valkey:8-alpine"
#                              (mirror all three into your registry on-prem)
#
# PIPELINE SPEED CONTROLS:
# ------------------------
# Speed up your pipelines by skipping optional quality checks and tests.
# Set these per-pipeline run or as project variables:
#
#   RUN_QUALITY_CHECKS         Skip linting and YAML validation
#                              Set to "false" to skip (default: "true")
#                              Skips: go_lint, yaml_check
#
#   RUN_TESTS                  Skip test execution
#                              Set to "false" to skip (default: "true")
#                              Skips: go_test
#
#   RUN_E2E                    Run the end-to-end job against a throwaway
#                              NetBox started as CI services.
#                              Set to "true" to enable (default: "false")
#                              Requires a Docker-executor runner and the three
#                              images above reachable from it.
#
# HOW TO USE:
# 1. Per-pipeline: GitLab → CI/CD → Run Pipeline → Add variable
# 2. Project-wide: GitLab → Settings → CI/CD → Variables
# 3. Example: Set RUN_QUALITY_CHECKS=false for faster development iterations
#
# =============================================================================

stages:
  - test      # Run tests
  - build     # Build Go binary
  - validate  # Validate YAML and configuration
  - plan      # Dry-run preview (Merge Requests)
  - apply     # Apply changes (Main branch)

variables:
  # ===========================================================================
  # ENVIRONMENT-SPECIFIC VARIABLES
  # Override these in GitLab CI/CD Settings > Variables for your environment
  # ===========================================================================

  # GitLab Runner tag (override in GitLab Variables if needed)
  GITLAB_RUNNER_TAG: "docker"

  # Container image registry paths (override in GitLab Variables for private registries)
  GOLANG_IMAGE: "golang:1.24"
  # OpenTofu (drop-in Terraform replacement). The tf_* jobs invoke the `tofu`
  # CLI from this image; override to pin a version or use a private mirror.
  OPENTOFU_IMAGE: "ghcr.io/opentofu/opentofu:1.9"

  # END-TO-END TEST IMAGES
  # The e2e job starts a throwaway NetBox from these images as CI services.
  # Mirror them into your own registry and override here when running on-prem.
  NETBOX_IMAGE: "netboxcommunity/netbox:v4.6-3.3.0"
  POSTGRES_IMAGE: "postgres:16-alpine"
  REDIS_IMAGE: "valkey/valkey:8-alpine"

  # PROXMOX PROVISIONING (opt-in)
  # The Terraform jobs that provision VMs in Proxmox are disabled by default so
  # the NetBox pipeline runs standalone. Set ENABLE_PROXMOX="true" (and the
  # TF_VAR_proxmox_* variables) to turn on tf_validate/tf_plan/tf_apply.
  ENABLE_PROXMOX: "false"

  # END-TO-END TESTS (opt-in)
  # The e2e job drives the built binary against a real NetBox and asserts the
  # properties an in-memory fake cannot show: that a dry run writes nothing,
  # that a second apply has nothing left to do, and that pruning a converged
  # instance deletes nothing. It needs a Docker-executor runner that can pull
  # NETBOX_IMAGE/POSTGRES_IMAGE/REDIS_IMAGE, so it is off by default.
  RUN_E2E: "false"

  # ===========================================================================
  # PIPELINE CONTROL VARIABLES
  # Set these per-pipeline to skip optional jobs and speed up execution
  # ===========================================================================

  # RUN_QUALITY_CHECKS: Controls linting and YAML validation jobs
  # Set to "false" to skip quality checks (faster pipeline)
  # Default: "true" - runs all quality checks
  RUN_QUALITY_CHECKS: "true"

  # RUN_TESTS: Controls test execution (go_test)
  # Set to "false" to skip tests (faster pipeline)
  # Default: "true" - runs all tests
  RUN_TESTS: "true"

  # COVERAGE_THRESHOLD: Minimum total statement coverage (%) for go_test.
  # Current coverage is ~73%; the gate sits below that to catch regressions
  # without blocking routine changes. Raise it as coverage improves.
  COVERAGE_THRESHOLD: "65"

  # ===========================================================================
  # BUILD CONFIGURATION
  # ===========================================================================

  # Go variables
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  CGO_ENABLED: "1"

default:
  tags:
    - ${GITLAB_RUNNER_TAG}

cache:
  paths:
    - .cache/go-build
    - .go/pkg/mod

# =============================================================================
# GO JOBS
# =============================================================================

.go_base:
  image: ${GOLANG_IMAGE}
  before_script:
    - go version
    - go mod download

# Run Go tests
go_test:
  extends: .go_base
  stage: test
  script:
    - echo "🧪 Running Go tests..."
    - go test ./pkg/... -v -race -coverprofile=coverage.out -covermode=atomic
    - go tool cover -func=coverage.out | tail -1
    - |
      TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub(/%/, "", $3); print $3}')
      echo "Total statement coverage: ${TOTAL}% (minimum: ${COVERAGE_THRESHOLD}%)"
      if awk -v t="$TOTAL" -v m="$COVERAGE_THRESHOLD" 'BEGIN { exit !(t < m) }'; then
        echo "❌ Coverage ${TOTAL}% is below the required ${COVERAGE_THRESHOLD}%"
        exit 1
      fi
    - echo "✅ All Go tests passed!"
  coverage: '/^total:.*\s(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
  rules:
    - if: $RUN_TESTS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# End-to-end test against a real NetBox.
#
# NetBox, PostgreSQL and Redis run as CI services. FF_NETWORK_PER_BUILD is
# required: without it the service containers get no shared network and NetBox
# cannot reach its database.
#
# The credentials below are throwaway values for a container that lives for the
# length of one job. Do not reuse them anywhere else. NetBox 4.5+ issues "v2"
# tokens (nbt_<key>.<secret>) and its container bootstrap only ever creates
# that kind, which is why NETBOX_TOKEN is assembled from the key and secret.
e2e:
  extends: .go_base
  stage: test
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
    - name: ${REDIS_IMAGE}
      alias: redis
    - name: ${NETBOX_IMAGE}
      alias: netbox
  variables:
    FF_NETWORK_PER_BUILD: "true"
    # PostgreSQL service
    POSTGRES_DB: netbox
    POSTGRES_USER: netbox
    POSTGRES_PASSWORD: netbox
    # NetBox -> PostgreSQL / Redis
    DB_HOST: postgres
    DB_NAME: netbox
    DB_USER: netbox
    DB_PASSWORD: netbox
    REDIS_HOST: redis
    REDIS_DATABASE: "0"
    REDIS_CACHE_HOST: redis
    REDIS_CACHE_DATABASE: "1"
    SECRET_KEY: "ci-only-secret-key-at-least-fifty-characters-long-0123456789"
    API_TOKEN_PEPPER_1: "ci-only-token-pepper-at-least-fifty-characters-long-0123456789"
    SUPERUSER_NAME: admin
    SUPERUSER_EMAIL: admin@example.com
    SUPERUSER_PASSWORD: admin
    SUPERUSER_API_KEY: "citokenkey01"
    SUPERUSER_API_TOKEN: "0123456789abcdef0123456789abcdef01234567"
    # What the controller connects with
    NETBOX_URL: "http://netbox:8080"
    NETBOX_TOKEN: "nbt_citokenkey01.0123456789abcdef0123456789abcdef01234567"
    E2E_SEEDS: "1 2 3"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-yaml curl
  script:
    - echo "🔁 Running end-to-end tests against ${NETBOX_URL}..."
    - tests/e2e/run.sh
    - echo "🔁 Verifying that renames edit objects instead of duplicating them..."
    - tests/e2e/rename.sh
  rules:
    - if: $RUN_E2E != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# Build Go binary
go_build:
  extends: .go_base
  stage: build
  script:
    - echo "🔨 Building Go binary..."
    # Stamp the build so `netbox-gitops --version` identifies exactly what ran,
    # which is what makes the changelog's upgrade advice actionable.
    - |
      VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}}"
      go build -v -trimpath \
        -ldflags "-X main.version=${VERSION} -X main.commit=${CI_COMMIT_SHORT_SHA} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -o netbox-gitops ./cmd/netbox-gitops/
    - ./netbox-gitops --version
    - ./netbox-gitops --help
    - echo "✅ Go binary built successfully!"
  artifacts:
    paths:
      - netbox-gitops
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# Validate with Go (dry-run)
go_validate:
  extends: .go_base
  stage: validate
  dependencies:
    - go_build
  script:
    - echo "🔍 Validating with Go implementation..."
    - ./netbox-gitops --dry-run
    - echo "✅ Validation passed!"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Plan changes with Go (MR preview)
go_plan:
  extends: .go_base
  stage: plan
  dependencies:
    - go_build
  script:
    - echo "📜 Generating sync plan with Go..."
    - ./netbox-gitops --dry-run | tee plan-output.txt
    - echo "✅ Plan generated successfully!"
  artifacts:
    paths:
      - plan-output.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Apply changes with Go (production)
go_apply:
  extends: .go_base
  stage: apply
  dependencies:
    - go_build
  script:
    - echo "🚀 Applying changes to NetBox with Go..."
    - ./netbox-gitops
    - echo "✅ Changes applied successfully!"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production

# =============================================================================
# UTILITY JOBS
# =============================================================================

go_lint:
  extends: .go_base
  stage: test
  script:
    - echo "🔍 Running Go linters..."
    - go fmt ./...
    - go vet ./...
    - echo "✅ Linting passed!"
  allow_failure: true
  rules:
    - if: $RUN_QUALITY_CHECKS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

yaml_check:
  extends: .go_base
  stage: test
  script:
    - echo "📝 Checking YAML syntax..."
    # Check YAML files in example directory (used by CI) and any custom definitions
    - go run ./cmd/yamlcheck
  rules:
    - if: $RUN_QUALITY_CHECKS == "false"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

debug_environment:
  extends: .go_base
  stage: build
  script:
    - echo "📂 Repository structure:"
    - ls -la
    - echo "📂 Example directory structure:"
    - ls -la example/ || echo "No example directory"
    - echo "📦 Go modules:"
    - go list -m all
    - echo "🔧 Go environment:"
    - go env
    - echo "📄 Binary info:"
    - ./netbox-gitops --help || echo "Binary not built yet"
    - echo "🧪 Testing data directory access:"
    - ls -la definitions/ inventory/ || echo "Data directories not found"
  dependencies:
    - go_build
  when: manual
  allow_failure: true

# =============================================================================
# PROXMOX PROVISIONING (OpenTofu) — second consumer of the VM YAML
# =============================================================================
# These jobs provision the VMs declared in inventory/virtual/*.yaml onto
# Proxmox, in parallel with the NetBox sync (they have no dependency on the
# go_* jobs). See terraform/README.md and docs/PLAN_YAML_VM_PIPELINE.md.
#
# Required CI variables when ENABLE_PROXMOX="true":
#   TF_VAR_proxmox_endpoint    e.g. https://pve.example.com:8006/api2/json
#   TF_VAR_proxmox_api_token   user@realm!tokenid=secret          (masked)
# No SSH is needed: clone + cloud-init run over the API.
# Optional: TF_VAR_proxmox_insecure, TF_VAR_default_gateway, TF_VAR_vlan_tags,
#           TF_VAR_ci_ssh_keys, TF_VAR_cpu_type, …

# Single source of truth for the environments to provision. Each gets its own
# VM folder (inventory/virtual/<env>/) and its own GitLab-managed OpenTofu
# state (proxmox-<env>). This anchor is referenced by every job's
# parallel:matrix below (tf_generate/tf_plan/tf_apply), so the list lives in
# exactly one place — there is no second copy to keep in sync.
.proxmox_envs: &proxmox_envs ["prod", "stage", "playground"]

# tf_generate turns each environment's VM YAML into a per-env tfvars file
# (terraform/generated.<env>.tfvars.json) using the same loader as the NetBox
# controller. Pure Go, no external deps, so it always runs and guards against
# tfgen regressions even when Proxmox is disabled. One matrix job per env;
# tfgen now errors on a mistyped --group, so a bad env fails the job instead of
# silently emitting an empty (destroy-everything) tfvars file.
tf_generate:
  extends: .go_base
  stage: validate
  parallel:
    matrix:
      - ENV: *proxmox_envs
  script:
    - echo "🧩 Generating OpenTofu vars for environment '${ENV}'..."
    - go run ./cmd/tfgen --data-dir . --group "${ENV}" --out "terraform/generated.${ENV}.tfvars.json"
    - cat "terraform/generated.${ENV}.tfvars.json"
  artifacts:
    paths:
      - terraform/generated.*.tfvars.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# Per-environment OpenTofu: same module, one GitLab-managed state per env
# (proxmox-<env>). The state name and backend address are derived from the
# matrix's $ENV in the shell so there's no fragile nested CI-variable expansion.
.opentofu_env:
  image:
    name: ${OPENTOFU_IMAGE}
    entrypoint: [""]
  before_script:
    - cd terraform
    - export TF_STATE_NAME="proxmox-${ENV}"
    # GitLab's managed state backend endpoint is named ".../terraform/state/..."
    # for both Terraform and OpenTofu — this is a GitLab API path, not a CLI name.
    - export TF_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    - tofu init -input=false
      -backend-config="address=${TF_ADDRESS}"
      -backend-config="lock_address=${TF_ADDRESS}/lock"
      -backend-config="unlock_address=${TF_ADDRESS}/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"

# Validate the module once — env-agnostic, so no backend/state is needed.
tf_validate:
  image:
    name: ${OPENTOFU_IMAGE}
    entrypoint: [""]
  stage: validate
  needs:
    - tf_generate
  before_script:
    - cd terraform
    - tofu init -input=false -backend=false
  script:
    - tofu fmt -check -recursive
    - tofu validate
  rules:
    - if: $ENABLE_PROXMOX != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# One plan per environment, each against its own state. The plan is saved to a
# binary file (tfplan.<env>) that tf_apply consumes verbatim — so what gets
# applied is exactly what was planned and reviewed, never a fresh re-plan. This
# runs on MRs (preview) and on the default branch (so the apply pipeline has a
# fresh, reviewable plan to apply).
tf_plan:
  extends: .opentofu_env
  stage: plan
  needs:
    - tf_generate
  parallel:
    matrix:
      - ENV: *proxmox_envs
  script:
    # -no-color keeps the saved human plan free of ANSI escapes so tf_apply's
    # destroy-detection grep below matches reliably.
    - tofu plan -input=false -no-color -lock-timeout=120s -var-file="generated.${ENV}.tfvars.json" -out="tfplan.${ENV}" | tee "tf-plan-${ENV}.txt"
  artifacts:
    paths:
      - terraform/tfplan.*
      - terraform/tf-plan-*.txt
      # Pass the resolved dependency lock to tf_apply so its `tofu init` selects
      # the exact provider version this plan was built against. Without it, a
      # patch released within `~> 0.109.0` between the two jobs would make
      # `tofu apply <planfile>` reject the saved plan. (If a committed
      # terraform/.terraform.lock.hcl exists, it takes precedence and this is a
      # harmless no-op.)
      - terraform/.terraform.lock.hcl
    expire_in: 1 week
  rules:
    - if: $ENABLE_PROXMOX != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# One apply per environment (manual gate), each against its own state. It applies
# the saved plan file from tf_plan rather than re-planning, so the operator
# approves and applies exactly the reviewed change set (no -auto-approve of an
# unseen plan). If the state has drifted since the plan, Terraform rejects the
# stale plan and the job fails safely instead of applying something different —
# re-run the pipeline to get a fresh plan.
#
# resource_group serialises applies per environment across pipelines: GitLab
# runs at most one tf_apply for a given env at a time, so two pipelines on the
# default branch can never apply to the same proxmox-<env> state concurrently.
# This is defence-in-depth on top of the backend's own state lock.
tf_apply:
  extends: .opentofu_env
  stage: apply
  needs:
    - tf_plan
  parallel:
    matrix:
      - ENV: *proxmox_envs
  resource_group: proxmox-${ENV}
  script:
    # Destroy safety gate. This is a GitOps module: removing a VM from the YAML
    # (or a replacement triggered by an immutable change) makes OpenTofu DESTROY
    # a real, running VM — irreversible. The saved human plan from tf_plan lists
    # one "# <addr> will be destroyed / must be replaced" line per destructive
    # action; count them straight from that artifact (offline, no jq needed).
    # Fail closed: a missing plan file aborts rather than applying blind.
    - |
      PLAN_TXT="tf-plan-${ENV}.txt"
      if [ ! -f "${PLAN_TXT}" ]; then
        echo "❌ Plan summary ${PLAN_TXT} is missing; refusing to apply (fail-closed)."
        exit 1
      fi
      DESTROYS=$(grep -cE '^[[:space:]]*# .*(will be destroyed|must be replaced)$' "${PLAN_TXT}" || true)
      DESTROYS=${DESTROYS:-0}
      echo "Plan for '${ENV}' will destroy/replace ${DESTROYS} resource(s)."
      if [ "${DESTROYS}" -gt 0 ]; then
        case ",${TF_ALLOW_DESTROY}," in
          *",${ENV},"*)
            echo "⚠️  ${DESTROYS} resource(s) will be DESTROYED/REPLACED in '${ENV}' (confirmed via TF_ALLOW_DESTROY)." ;;
          *)
            echo "❌ Refusing to apply: ${DESTROYS} resource(s) would be DESTROYED or REPLACED in '${ENV}'."
            echo "   Destroying a VM is irreversible, so it is blocked by default."
            echo "   Review the destroyed resources in ${PLAN_TXT}, and if this is intended,"
            echo "   re-run this job with the CI variable TF_ALLOW_DESTROY=${ENV} to confirm."
            exit 1 ;;
        esac
      fi
    - tofu apply -input=false -lock-timeout=120s "tfplan.${ENV}"
  rules:
    - if: $ENABLE_PROXMOX != "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: proxmox-${ENV}
