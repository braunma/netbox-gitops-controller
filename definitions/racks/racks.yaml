# Rack Definitions
# Physical racks within data centers
#
# Grouped form: `defaults` is merged into every rack under `items`; a rack's
# own value wins. `status` (default "active") and the `gitops` tag (stamped
# automatically) are not repeated.

defaults:
  u_height: 42

items:
  # Berlin DC Racks
  - name: "Rack A01"
    slug: "berlin-rack-a01"
    site: "berlin-dc"

  - name: "Rack A02"
    slug: "berlin-rack-a02"
    site: "berlin-dc"

  - name: "Rack B01"
    slug: "berlin-rack-b01"
    site: "berlin-dc"
    u_height: 48

  # Frankfurt DC Racks
  - name: "Rack C01"
    slug: "frankfurt-rack-c01"
    site: "frankfurt-dc"

  - name: "Rack C02"
    slug: "frankfurt-rack-c02"
    site: "frankfurt-dc"

  # Munich Lab Racks
  - name: "Lab Rack 01"
    slug: "munich-lab-rack-01"
    site: "munich-lab"
    tags: ["lab"]
