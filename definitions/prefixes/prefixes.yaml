# yaml-language-server: $schema=../../schema/prefix.json
# IP Prefix Definitions
# IP subnets and address allocations

# ========================================
# Berlin DC Prefixes
# ========================================

# Management Network
- prefix: "10.10.10.0/24"
  description: "Berlin DC - Management network (iDRAC, IPMI, switches)"
  site: "berlin-dc"
  vlan: "Management"
  vrf: "Management"
  is_pool: true

# Production Server Network
- prefix: "10.10.20.0/24"
  description: "Berlin DC - Production server network"
  site: "berlin-dc"
  vlan: "Server-Production"
  vrf: "Production"
  is_pool: true
  tags: ["production"]

# Storage Network
- prefix: "10.10.30.0/24"
  description: "Berlin DC - Storage network (iSCSI/NFS)"
  site: "berlin-dc"
  vlan: "Storage"
  vrf: "Storage"
  is_pool: true

# AI/ML Compute Network
- prefix: "10.10.40.0/24"
  description: "Berlin DC - AI/ML compute network"
  site: "berlin-dc"
  vlan: "AI-Compute"
  vrf: "Production"
  is_pool: true
  tags: ["ai-ml"]

