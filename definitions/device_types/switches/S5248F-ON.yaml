# Dell PowerSwitch S5248F-ON: 48x 25G SFP28 plus 6x 100G QSFP28 and an
# out-of-band management port.
#
# A range in a template name (`Eth1/{1-48}`) stands for one template per
# number; the loader expands it when the file is read. Write the name in
# quotes: unquoted, `{1-48}` is YAML flow-mapping syntax.
- model: "S5248F-ON"
  slug: "dell-s5248f-on"
  manufacturer: "Dell"
  u_height: 1
  is_full_depth: true

  interfaces:
    - { name: "Management 1/1", type: "1000base-t", mgmt_only: true }
    - { name: "Eth1/{1-48}", type: "25gbase-x-sfp28" }
    - { name: "Eth1/{49-54}", type: "100gbase-x-qsfp28" }
