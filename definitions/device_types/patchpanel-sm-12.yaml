# yaml-language-server: $schema=../../schema/device-type.json
# 12-port single-mode LC patch panel. Front port n is bridged to rear port n;
# the two ranges count along with each other, so one line declares all twelve
# mappings.
- model: "Patch Panel 12-Port SM (LC)"
  slug: "pp-12-sm-lc"
  manufacturer: "Generic"
  u_height: 1
  is_full_depth: false

  front_ports:
    - { name: "{1-12}", type: "lc", rear_port: "{1-12}" }

  rear_ports:
    - { name: "{1-12}", type: "lc" }
