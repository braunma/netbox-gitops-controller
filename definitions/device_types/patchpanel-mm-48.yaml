# yaml-language-server: $schema=../../schema/device-type.json
# 48-port multi-mode LC fiber panel. Front port n (the room side, where patch
# cables plug in) is bridged to rear port n (the backbone side).
- model: "Fiber Panel 48-Port MM (LC)"
  slug: "pp-48-mm-lc"
  manufacturer: "Generic"
  u_height: 1 # 1U at this density; a lower-density 48-port panel is often 2U
  is_full_depth: false

  front_ports:
    - { name: "{1-48}", type: "lc", rear_port: "{1-48}" }

  rear_ports:
    - { name: "{1-48}", type: "lc" }
