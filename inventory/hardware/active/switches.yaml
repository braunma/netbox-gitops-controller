# Switch Inventory - Active Network Equipment
#
# Ports come from the dell-s5248f-on device type template, so a port is listed
# here only for what the template cannot know: its access or trunk VLANs, its
# management IP, an MTU.
#
# Cables are NOT declared here. The endpoint side (server, storage, patch
# panel) owns every `link:`, so re-patching a port is a one-place edit; see
# inventory/hardware/active/servers.yaml.

defaults:
  device_type_slug: "dell-s5248f-on"
  role_slug: "leaf-switch"
  position: 40
  # NetBox rejects a rack position without a face
  # ("Must specify rack face when defining rack position").
  face: "front"
  status: "active"
  tags: ["gitops", "production"]

devices:
  # ========================================
  # Berlin DC - Leaf Switches
  # ========================================

  - name: "berlin-leaf-01"
    site_slug: "berlin-dc"
    rack_slug: "berlin-rack-a01"
    serial: "LEAF01-SN-12345"

    interfaces:
      - name: "Management 1/1"
        description: "Out-of-band management"
        ip:
          address: "10.10.10.11/24"
          dns_name: "berlin-leaf-01-mgmt.example.com"
          status: "active"
          vrf: "Management"
        address_role: "primary"

      # Server downlinks (cabled from the server side)
      - name: "Eth1/1"
        mode: "access"
        untagged_vlan: "Server-Production"
        description: "Connection to berlin-srv-web-01"

      - name: "Eth1/2"
        mode: "access"
        untagged_vlan: "Server-Production"
        description: "Connection to berlin-srv-web-02"

      - name: "Eth1/3"
        mode: "access"
        untagged_vlan: "AI-Compute"
        description: "Connection to berlin-srv-ai-01"

      # Uplink to spine
      - name: "Eth1/49"
        mode: "tagged"
        tagged_vlans: ["Management", "Server-Production", "Storage", "AI-Compute"]
        description: "Uplink to spine (future)"
        mtu: 9000

  - name: "berlin-leaf-02"
    site_slug: "berlin-dc"
    rack_slug: "berlin-rack-a02"
    serial: "LEAF02-SN-67890"

    interfaces:
      - name: "Management 1/1"
        description: "Out-of-band management"
        ip:
          address: "10.10.10.12/24"
          dns_name: "berlin-leaf-02-mgmt.example.com"
          status: "active"
          vrf: "Management"
        address_role: "primary"

      - name: "Eth1/1"
        mode: "access"
        untagged_vlan: "Storage"
        description: "Connection to storage system"

  # ========================================
  # Frankfurt DC - Leaf Switch
  # ========================================

  - name: "frankfurt-leaf-01"
    site_slug: "frankfurt-dc"
    rack_slug: "frankfurt-rack-c01"
    serial: "LEAF-FFM-11111"

    interfaces:
      - name: "Management 1/1"
        description: "Out-of-band management"
        ip:
          address: "10.20.10.11/24"
          dns_name: "frankfurt-leaf-01-mgmt.example.com"
          status: "active"
          vrf: "Management"
        address_role: "primary"
