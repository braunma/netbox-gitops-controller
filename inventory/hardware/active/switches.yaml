# yaml-language-server: $schema=../../../schema/device.json
# Switch Inventory - Active Network Equipment
#
# Ports come from the dell-s5248f-on device type template, so a port is listed
# here only for what the template cannot know: its access or trunk VLANs, its
# management IP, an MTU.
#
# Server cables are NOT declared here: the endpoint side (server, storage)
# owns the `link:`, so re-patching a port is a one-place edit; see
# inventory/hardware/active/servers.yaml. The inter-switch trunk through the
# patch panels is declared once, on berlin-leaf-01 Eth1/49, as a path.

defaults:
  device_type: "dell-s5248f-on"
  role: "leaf-switch"
  position: 40
  tags: ["production"]
  interfaces:
    "Management 1/1":
      description: "Out-of-band management"
      ip: { status: "active", vrf: "Management" }
      address_role: "primary"

devices:
  # ========================================
  # Berlin DC - Leaf Switches
  # ========================================

  - name: "berlin-leaf-01"
    site: "berlin-dc"
    rack: "berlin-rack-a01"
    serial: "LEAF01-SN-12345"

    interfaces:
      - name: "Management 1/1"
        ip: { address: "10.10.10.11/24", dns_name: "berlin-leaf-01-mgmt.example.com" }

      # Server downlinks (cabled from the server side)
      - name: "Eth1/1"
        mode: "access"
        untagged_vlan: "Server-Production"
        description: "Connection to berlin-srv-web-01"

      - name: "Eth1/2"
        mode: "access"
        untagged_vlan: "Server-Production"
        description: "Connection to berlin-srv-web-02"

      - name: "Eth1/3"
        mode: "access"
        untagged_vlan: "AI-Compute"
        description: "Connection to berlin-srv-ai-01"

      # Inter-switch trunk to berlin-leaf-02 in rack A02, through pp-01
      # front 3 and pp-02 front 3; one declaration, three cables. The type
      # comes from the panels' cable_defaults; blue cords mark the trunk, the
      # backbone keeps the panels' purple.
      - name: "Eth1/49"
        mode: "tagged"
        tagged_vlans: ["Management", "Server-Production", "Storage", "AI-Compute"]
        description: "Trunk to berlin-leaf-02 via patch panels"
        mtu: 9000
        link: { via: ["berlin-pp-01:3", "berlin-pp-02:3"], peer_device: "berlin-leaf-02", peer_port: "Eth1/49", color: "blue" }

  - name: "berlin-leaf-02"
    site: "berlin-dc"
    rack: "berlin-rack-a02"
    serial: "LEAF02-SN-67890"

    interfaces:
      - name: "Management 1/1"
        ip: { address: "10.10.10.12/24", dns_name: "berlin-leaf-02-mgmt.example.com" }

      - name: "Eth1/1"
        mode: "access"
        untagged_vlan: "Storage"
        description: "Connection to storage system"

      # Far end of berlin-srv-web-02 eth1 (the strand is declared there).
      - name: "Eth1/2"
        mode: "access"
        untagged_vlan: "Server-Production"
        description: "Connection to berlin-srv-web-02 eth1 (via patch panels)"

      # Far end of the trunk from berlin-leaf-01 Eth1/49 (declared there).
      - name: "Eth1/49"
        mode: "tagged"
        tagged_vlans: ["Management", "Server-Production", "Storage", "AI-Compute"]
        description: "Trunk to berlin-leaf-01 via patch panels"
        mtu: 9000

  # ========================================
  # Frankfurt DC - Leaf Switch
  # ========================================

  - name: "frankfurt-leaf-01"
    site: "frankfurt-dc"
    rack: "frankfurt-rack-c01"
    serial: "LEAF-FFM-11111"

    interfaces:
      - name: "Management 1/1"
        ip: { address: "10.20.10.11/24", dns_name: "frankfurt-leaf-01-mgmt.example.com" }
