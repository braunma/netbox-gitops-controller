# Server Inventory - Munich Lab
#
# A second file for a second site: one `defaults` block per site, rack or
# hardware batch keeps each device down to its name, position and addresses.

defaults:
  site_slug: "munich-lab"
  role_slug: "server"
  device_type_slug: "poweredge-r740"
  rack_slug: "munich-lab-rack-01"
  face: "front"
  status: "active"
  tags: ["gitops", "lab", "development"]

devices:
  - name: "munich-lab-srv-01"
    position: 10
    serial: "LAB-SRV-001"

    interfaces:
      - name: "idrac"
        description: "Dell iDRAC interface"
        ip:
          address: "192.168.100.10/24"
          dns_name: "munich-lab-srv-01-idrac.lab.example.com"
          status: "active"
          vrf: "Lab"

      - name: "eth0"
        description: "Primary lab interface"
        ip:
          address: "192.168.200.10/24"
          dns_name: "munich-lab-srv-01.lab.example.com"
          status: "active"
          vrf: "Lab"
        address_role: "primary"
