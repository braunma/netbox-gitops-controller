# Server Inventory - Munich Lab
#
# A second file for a second site: one `defaults` block per site, rack or
# hardware batch keeps each device down to its name, position and addresses.

defaults:
  site: "munich-lab"
  role: "server"
  device_type: "poweredge-r740"
  rack: "munich-lab-rack-01"
  tags: ["lab", "development"]
  interfaces:
    idrac:
      description: "Dell iDRAC interface"
      ip: { status: "active", vrf: "Lab" }
    eth0:
      description: "Primary lab interface"
      ip: { status: "active", vrf: "Lab" }
      address_role: "primary"

devices:
  - name: "munich-lab-srv-01"
    position: 10
    serial: "LAB-SRV-001"

    interfaces:
      - name: "idrac"
        ip: { address: "192.168.100.10/24", dns_name: "munich-lab-srv-01-idrac.lab.example.com" }

      - name: "eth0"
        ip: { address: "192.168.200.10/24", dns_name: "munich-lab-srv-01.lab.example.com" }
