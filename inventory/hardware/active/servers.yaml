# Server Inventory - Berlin DC
#
# Grouped form: everything under `defaults` is merged into every device below,
# so a device carries only what is specific to it. Device values win over
# defaults; `tags` are combined rather than replaced.
#
# Conventions (see the README section "Conventions that keep the YAML small"):
#   - Ports come from the device type template, so an interface is listed here
#     only when it carries device-specific data (an IP, a VLAN, a cable) and
#     never repeats the template's `type`.
#   - Interfaces are enabled by default; only `enabled: false` is worth writing.
#   - A cable is declared on ONE end only — the server side. The reconciler
#     wires both ends from that single declaration.

defaults:
  site_slug: "berlin-dc"
  role_slug: "server"
  face: "front"
  status: "active"
  tags: ["gitops"]

devices:
  # ========================================
  # Web Servers
  # ========================================

  - name: "berlin-srv-web-01"
    device_type_slug: "poweredge-r740"
    rack_slug: "berlin-rack-a01"
    position: 10
    serial: "WEB01-SN-ABCDE"
    asset_tag: "ASSET-001"
    tags: ["production"]

    interfaces:
      - name: "idrac"
        description: "Dell iDRAC interface"
        ip:
          address: "10.10.10.101/24"
          dns_name: "berlin-srv-web-01-idrac.example.com"
          status: "active"
          vrf: "Management"

      - name: "eth0"
        description: "Primary production interface"
        ip:
          address: "10.10.20.101/24"
          dns_name: "berlin-srv-web-01.example.com"
          status: "active"
          vrf: "Production"
        address_role: "primary"
        link:
          peer_device: "berlin-leaf-01"
          peer_port: "Eth1/1"
          cable_type: "dac-active"

      - name: "eth1"
        description: "Secondary network interface"

  - name: "berlin-srv-web-02"
    device_type_slug: "poweredge-r740"
    rack_slug: "berlin-rack-a01"
    position: 12
    serial: "WEB02-SN-FGHIJ"
    asset_tag: "ASSET-002"
    tags: ["production"]

    interfaces:
      - name: "idrac"
        description: "Dell iDRAC interface"
        ip:
          address: "10.10.10.102/24"
          dns_name: "berlin-srv-web-02-idrac.example.com"
          status: "active"
          vrf: "Management"

      - name: "eth0"
        description: "Primary production interface"
        ip:
          address: "10.10.20.102/24"
          dns_name: "berlin-srv-web-02.example.com"
          status: "active"
          vrf: "Production"
        address_role: "primary"
        link:
          peer_device: "berlin-leaf-01"
          peer_port: "Eth1/2"
          cable_type: "dac-active"

      - name: "eth1"
        description: "Secondary network interface"

  # ========================================
  # AI/ML Server with GPU Module Bays
  #
  # Interface names come from the XE9680 device type template: the embedded
  # 1G NICs are NIC.Embedded.*, the 100G ports NIC.Slot.33-*.
  # ========================================

  - name: "berlin-srv-ai-01"
    device_type_slug: "poweredge-xe9680"
    rack_slug: "berlin-rack-b01"
    position: 5
    serial: "AI01-SN-XYZ123"
    asset_tag: "ASSET-AI-001"
    tags: ["ai-ml", "high-performance"]

    # GPU modules (uncomment once the module types are defined; the bay names
    # must match the module_bays of the poweredge-xe9680 device type)
    # modules:
    #   - name: "GPU Slot 1"
    #     module_type_slug: "nvidia-h100-80gb"
    #     status: "active"
    #     serial: "GPU-H100-001"
    #     description: "Primary GPU for AI training"

    interfaces:
      - name: "idrac"
        description: "Dell iDRAC interface"
        ip:
          address: "10.10.10.201/24"
          dns_name: "berlin-srv-ai-01-idrac.example.com"
          status: "active"
          vrf: "Management"

      - name: "NIC.Embedded.1-1-1"
        description: "Management interface"
        ip:
          address: "10.10.20.201/24"
          dns_name: "berlin-srv-ai-01.example.com"
          status: "active"
          vrf: "Production"

      - name: "NIC.Slot.33-1-1"
        description: "AI/ML compute network"
        mtu: 9000
        ip:
          address: "10.10.40.201/24"
          dns_name: "berlin-srv-ai-01-compute.example.com"
          status: "active"
          vrf: "Production"
        address_role: "primary"
        link:
          peer_device: "berlin-leaf-01"
          peer_port: "Eth1/3"
          cable_type: "dac-active"

      - name: "NIC.Slot.33-2-1"
        description: "AI/ML compute network (redundant)"
        mtu: 9000

  # ========================================
  # Storage System
  #
  # The Isilon A300 is a 4U chassis holding up to four nodes: the chassis is
  # the racked parent, each node a child device installed into one of its
  # device bays. Interfaces and IPs belong to the node, not the chassis.
  # ========================================

  - name: "berlin-storage-01"
    device_type_slug: "isilon-a300-chassis"
    role_slug: "storage"
    rack_slug: "berlin-rack-a02"
    position: 20
    serial: "STOR01-SN-9999"
    asset_tag: "ASSET-STOR-001"

  - name: "berlin-storage-01-node-1"
    device_type_slug: "isilon-a300-node"
    role_slug: "storage"
    parent_device: "berlin-storage-01"
    device_bay: "Node 1"
    serial: "STOR01-N1-9999"

    interfaces:
      - name: "ext-1"
        description: "Storage network interface"
        mtu: 9000
        ip:
          address: "10.10.30.10/24"
          dns_name: "berlin-storage-01.example.com"
          status: "active"
          vrf: "Storage"
        address_role: "primary"
        link:
          peer_device: "berlin-leaf-02"
          peer_port: "Eth1/1"
          cable_type: "dac-active"
