# Patch Panel Inventory - Passive Fiber Infrastructure
#
# Grouped form: `defaults` carries what every panel shares. Each port's `type`
# comes from the device type template (pp-12-sm-lc, pp-48-mm-lc), so a port is
# listed here only for what the template cannot know: its label, description
# and, on a front port, the rear port it maps to.

defaults:
  role: "patch-panel"
  position: 42
  face: "front"

items:
  # ========================================
  # Berlin DC - Fiber Patch Panels
  # ========================================

  - name: "berlin-pp-01"
    site: "berlin-dc"
    device_type: "pp-12-sm-lc"
    rack: "berlin-rack-a01"

    # Front Ports (facing the room)
    front_ports:
      - name: "1"
        label: "To Rack A02 Port 1"
        rear_port: "1"
        rear_port_position: 1
        description: "Fiber link to adjacent rack"

      - name: "2"
        label: "To Rack A02 Port 2"
        rear_port: "2"
        rear_port_position: 1

      - name: "3"
        label: "Reserved"
        rear_port: "3"
        rear_port_position: 1

    # Rear Ports (facing the wall/backbone)
    rear_ports:
      - name: "1"
        label: "Backbone to MDF"
        description: "Connection to main distribution frame"

      - name: "2"
        label: "Backbone to MDF"

      - name: "3"
        label: "Reserved"

  - name: "berlin-pp-02"
    site: "berlin-dc"
    device_type: "pp-12-sm-lc"
    rack: "berlin-rack-a02"

    front_ports:
      - name: "1"
        label: "Cross-connect"
        rear_port: "1"
        rear_port_position: 1

    rear_ports:
      - name: "1"
        label: "Backbone"

  # ========================================
  # Berlin DC - Multi-mode Patch Panel
  # ========================================

  - name: "berlin-pp-mm-01"
    site: "berlin-dc"
    device_type: "pp-48-mm-lc"
    rack: "berlin-rack-b01"

    front_ports:
      - name: "1"
        label: "Short-range fiber port 1"
        rear_port: "1"
        rear_port_position: 1

    rear_ports:
      - name: "1"
        label: "Backbone port 1"

  # ========================================
  # Frankfurt DC - Patch Panel
  # ========================================

  - name: "frankfurt-pp-01"
    site: "frankfurt-dc"
    device_type: "pp-12-sm-lc"
    rack: "frankfurt-rack-c01"

    front_ports:
      - name: "1"
        rear_port: "1"
        rear_port_position: 1

    rear_ports:
      - name: "1"
