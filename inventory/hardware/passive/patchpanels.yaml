# yaml-language-server: $schema=../../../schema/device.json
# Patch Panel Inventory - Passive Fiber Infrastructure
#
# Grouped form: `defaults` carries what every panel shares. Each port's `type`
# comes from the device type template (pp-12-sm-lc, pp-48-mm-lc), and so does
# the front-to-rear mapping, so a port is listed here only for what the
# template cannot know: its label, description or cable.
#
# Two strands run between rack A01 and rack A02 through pp-01 and pp-02:
#
#   berlin-srv-web-02[eth1] -- pp-01[front 2 > rear 2] == pp-02[rear 2 > front 2] -- berlin-leaf-02[Eth1/2]
#   berlin-leaf-01[Eth1/49] -- pp-01[front 3 > rear 3] == pp-02[rear 3 > front 3] -- berlin-leaf-02[Eth1/49]
#
# Neither is declared in this file. Each strand is written once, at its
# endpoint, as `link: { via: [...] }` (see servers.yaml and switches.yaml);
# the loader derives the three cables from it and the panels' device type.
# tests/e2e/repo-data.sh asks NetBox to trace both strands end to end.

defaults:
  role: "patch-panel"
  position: 42
  # What a cable on these panels is unless the cable says otherwise: single-mode
  # patch cords into the front, purple single-mode backbones out of the rear.
  # A path through a panel (`link.via`) names a type or colour only to differ.
  cable_defaults:
    front: { cable_type: "smf-os2", color: "yellow" }
    rear: { cable_type: "smf-os2", color: "purple" }

items:
  # ========================================
  # Berlin DC - Fiber Patch Panels
  # ========================================

  - name: "berlin-pp-01"
    site: "berlin-dc"
    device_type: "pp-12-sm-lc"
    rack: "berlin-rack-a01"

    # Front Ports (facing the room)
    front_ports:
      - name: "1"
        label: "To Rack A02 Port 1"
        rear_port: "1"
        rear_port_position: 1
        description: "Fiber link to adjacent rack"


    # Rear Ports (facing the wall/backbone)
    rear_ports:
      - name: "1"
        label: "Backbone to MDF"
        description: "Connection to main distribution frame"


  - name: "berlin-pp-02"
    site: "berlin-dc"
    device_type: "pp-12-sm-lc"
    rack: "berlin-rack-a02"

    front_ports:
      - name: "1"
        label: "Cross-connect"
        rear_port: "1"
        rear_port_position: 1


    rear_ports:
      - name: "1"
        label: "Backbone"

  # ========================================
  # Berlin DC - Multi-mode Patch Panel
  # ========================================

  - name: "berlin-pp-mm-01"
    site: "berlin-dc"
    device_type: "pp-48-mm-lc"
    rack: "berlin-rack-b01"

    front_ports:
      - name: "1"
        label: "Short-range fiber port 1"
        rear_port: "1"
        rear_port_position: 1

    rear_ports:
      - name: "1"
        label: "Backbone port 1"

  # ========================================
  # Frankfurt DC - Patch Panel
  # ========================================

  # All ports come from the template; nothing is patched yet, so nothing to
  # say about any of them.
  - name: "frankfurt-pp-01"
    site: "frankfurt-dc"
    device_type: "pp-12-sm-lc"
    rack: "frankfurt-rack-c01"
