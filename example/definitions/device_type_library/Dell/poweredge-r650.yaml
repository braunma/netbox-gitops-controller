---
# Community device type library format: one device type per file, laid out as
# <library>/<Manufacturer>/<model>.yaml, with hyphenated component keys.
#
# Files in this layout can be used unchanged — point --devicetype-library (or
# DEVICETYPE_LIBRARY) at a checkout of the community library, or vendor the
# files you need into a directory like this one.
#
# Contrast with definitions/device_types/, which uses this project's native
# format: a YAML list per file and underscored keys.
manufacturer: Dell
model: PowerEdge R650
slug: dell-poweredge-r650
part_number: R650
u_height: 1
is_full_depth: true
airflow: front-to-rear
weight: 19.4
weight_unit: kg
comments: Example entry showing the community library format.
console-ports:
  - name: Serial
    type: rj-45
power-ports:
  - name: PSU1
    type: iec-60320-c14
    maximum_draw: 750
  - name: PSU2
    type: iec-60320-c14
    maximum_draw: 750
interfaces:
  - name: iDRAC
    type: 1000base-t
    mgmt_only: true
  - name: NIC1
    type: 25gbase-x-sfp28
  - name: NIC2
    type: 25gbase-x-sfp28
