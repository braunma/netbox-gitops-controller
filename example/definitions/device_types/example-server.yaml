# Example Server Device Type
#
# The interface templates below are the single source of truth for the
# physical ports of this model: NetBox copies them onto every device that is
# instantiated from this type. Inventory files then only reference ports by
# name and add what differs per device (IPs, VLANs, cabling) - they do not
# need to repeat `type` or `enabled`.
