# yaml-language-server: $schema=../../../../schema/virtual-machine.json
# A site-only VM: it belongs to no cluster, so it carries `site` instead.
# Lives in the playground environment folder; it is documented in NetBox like
# every other VM, because the controller scans inventory/virtual/ recursively
# across all environments.

- name: "edge-01"
  vmid: 201
  site: "test-lab"
  role: "vm" # role must have vm_role: true
  platform: "debian-12"
  status: "active"
  vcpus: 2
  memory: 4096
  tags: ["development"]
  interfaces:
    - name: "eth0"
      enabled: true
