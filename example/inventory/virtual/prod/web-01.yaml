# A hand-written production VM, one file per VM. The controller documents it in
# NetBox and never creates it on a hypervisor. When a Proxmox collector run
# finds this VM, it writes the facts it observed (vcpus, memory, disk, status,
# vmid) into this file — see docs/INGEST.md.

- name: "web-01"
  vmid: 101                        # Proxmox VMID; stored in NetBox `vmid` custom field
  vm_template_id: 800              # template VMID this VM was cloned from (documentation)
  node: "pve-01"                   # hypervisor node it runs on (documentation)
  cluster: "berlin-prod-cluster"   # clustered VM; inherits the cluster's site
  role_slug: "vm"                  # role must have vm_role: true
  platform: "ubuntu-22-04"
  tenant: "platform-engineering"
  status: "active"
  vcpus: 4
  memory: 8192                     # MB
  disk: 100                        # GB
  tags: ["gitops", "production"]
  interfaces:
    - name: "eth0"
      enabled: true
      mtu: 1500
      mode: "access"
      untagged_vlan: "Management"  # resolved at the cluster's site (berlin-dc)
      ip:
        address: "10.0.100.21/24"
        dns_name: "web-01.berlin.example.com"
      address_role: "primary"      # promotes this IP to the VM's primary_ip4
