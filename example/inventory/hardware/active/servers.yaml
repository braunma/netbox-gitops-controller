# Example Server Inventory for Testing
#
# This file uses the grouped `defaults` + `devices` form: fields under
# `defaults` are merged into every device below. Device values win over
# defaults, and `tags` are combined instead of replaced. `defaults.interfaces`
# does the same per interface name, for the interfaces a device lists; nested
# mappings such as `link` are merged key by key.
#
# Conventions demonstrated here:
#   - Interface `type` and `enabled` are NOT repeated: the ports come from
#     the device type template and interfaces are enabled by default.
#     Only list an interface at all when it carries device-specific data
#     (IPs, VLANs, descriptions, cabling).
#   - Cables are declared on ONE end only (the server/endpoint side).
#     The reconciler wires both ends from a single declaration.

defaults:
  device_type: "example-server-r100"
  role: "server"
  site: "berlin-dc"
  rack: "rack-a01"
  face: "front"
  tags: ["production"]
  interfaces:
    eth1:
      description: "Data interface"
      link: { cable_type: "cat6" }

devices:
  - name: "example-server-01"
    position: 10
    interfaces:
      - name: "eth0"
        description: "Management interface"
      - name: "eth1"
        link: { peer_device: "example-switch-01", peer_port: "GigabitEthernet1/0/1" }

  - name: "example-server-02"
    position: 12
    tags: ["lab"] # merged with the default tags -> gitops, production, lab
    interfaces:
      - name: "eth1"
        link: { peer_device: "example-switch-01", peer_port: "GigabitEthernet1/0/2" }
