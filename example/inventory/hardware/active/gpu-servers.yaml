# Example GPU Server Inventory
# This demonstrates module installation with managed tags

- name: "example-gpu-server-01"
  device_type: "example-gpu-server"
  role: "server"
  site: "berlin-dc"
  rack: "rack-a01"
  position: 30
  face: "front"
  serial: "GPU-SRV-001"
  asset_tag: "GPU-001"
  tags: ["production", "gpu"]

  # Modules demonstrate the managed tag feature
  modules:
    - name: "GPU-1"
      module_type: "ex-gpu-a100"
      serial: "GPU-CARD-001"
      description: "Primary GPU"

    - name: "GPU-2"
      module_type: "ex-gpu-a100"
      serial: "GPU-CARD-002"
      description: "Secondary GPU"

    - name: "GPU-3"
      module_type: "ex-gpu-a100"
      serial: "GPU-CARD-003"

    - name: "GPU-4"
      module_type: "ex-gpu-a100"
      # No serial - will be set to empty string

  # eth0/eth1 come from the device type template; only overrides are listed
  interfaces:
    - name: "eth0"
      description: "Management interface"

    - name: "eth1"
      description: "High-speed data interface"
